[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "safety-gate"
version = "0.1.0"
description = "Robot Safety Gate - System One Decision Model Pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "pyyaml>=6.0.1",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "jinja2>=3.1.3",
    "numpy>=1.26.0",
    "safetensors>=0.8.0",
    "scikit-learn>=1.9.1",
    "transformers>=5.20.2",
    "accelerate>=1.15.0",
    "pillow>=13.0.0",
    "torchvision>=0.29.1",
    "openai>=3.36.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
sg = "cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["harness", "data", "gate", "eval", "budget", "cli", "ui", "common"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
